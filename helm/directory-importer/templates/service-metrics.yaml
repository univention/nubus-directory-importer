{{- if .Values.metrics.enabled }}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: {{ printf "%s-metrics" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: "metrics"
  {{- if or .Values.additionalAnnotations .Values.metrics.service.annotations }}
  annotations:
    {{- with .Values.additionalAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
    {{- end }}
    {{- with .Values.metrics.service.annotations }}
    {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: "ClusterIP"
  ports:
    - name: "metrics"
      port: {{ .Values.metrics.port }}
      targetPort: "metrics"
      protocol: "TCP"
  selector:
    {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.additionalLabels "context" $ ) | nindent 4 }}
{{- end }}
