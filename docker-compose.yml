services:
  test-helm:
    image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.24@sha256:1f34d54d23452475db4e92a43b669b8cb1817c4837b0003b2d897d47ed2f9d35"
    pull_policy: "if_not_present"
    command: "pytest tests/helm_unit/"
    profiles:
      - "test"
    volumes:
      - "./helm/:/app/helm/"
      - "./tests/helm_unit/:/app/tests/helm_unit/"

  directory-importer:
    build:
      context: .
      dockerfile: docker/directory-importer/Dockerfile
      target: final
    image: artifacts.software-univention.de/nubus-dev/images/directory-importer:${IMAGE_TAG:-latest}
    read_only: true
    user: "app:app"
    cap_drop:
      - ALL
    volumes:
      - ./config/ad-domain-config.yaml:/etc/directory-importer/config.yaml:ro
      - ./examples/create_extended_attribute.py:/etc/directory-importer/create_extended_attribute.py:ro
      #- ./config/ca_nubus.crt:/etc/ssl/certs/ca-certificates-nubus.crt:ro
      #- ./config/ca_ad.crt:/etc/ssl/certs/ca-certificates-ad.crt:ro
    environment:
      LOG_LEVEL: "INFO"
      REPEAT: true
      REPEAT_DELAY: 300
      CONFIG_FILENAME: "/etc/directory-importer/config.yaml"
    network_mode: host

  directory-importer-ea:
    profiles:
      - "test"
    extends:
      service: directory-importer
    entrypoint: [".venv/bin/python3.13", "/etc/directory-importer/create_extended_attribute.py", "--base", "dc=swp-ldap,dc=internal", "--config", "/etc/directory-importer/config.yaml"]
